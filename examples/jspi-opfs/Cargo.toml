[package]
authors = ["The wasm-bindgen Developers"]
edition = "2021"
name = "jspi-opfs"
publish = false
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = { path = "../../crates/js-sys", features = ["experimental-jspi"] }
wasm-bindgen = { path = "../../" }

[dependencies.web-sys]
features = [
  "Blob",
  "File",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemWritableFileStream",
  "StorageManager",
  "WritableStream",
]
path = "../../crates/web-sys"

[lints]
workspace = true

# The JSPI suspend wrapper uses exception-handling instructions (try_table);
# wasm-pack's default wasm-opt invocation rejects them.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
