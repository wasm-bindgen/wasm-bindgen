[package]
authors = ["The wasm-bindgen Developers"]
description = "Bridging the gap between Rust Futures and JavaScript Promises"
documentation = "https://docs.rs/wasm-bindgen-futures"
edition = "2021"
homepage = "https://wasm-bindgen.github.io/wasm-bindgen/"
include = ["/LICENSE-*", "/src"]
license = "MIT OR Apache-2.0"
name = "wasm-bindgen-futures"
readme = "./README.md"
repository = "https://github.com/wasm-bindgen/wasm-bindgen/tree/master/crates/futures"
rust-version = "1.81"
version = "0.4.78"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
js-sys = { path = "../js-sys", version = "=0.3.105", default-features = false }
wasm-bindgen = { path = "../..", version = "=0.2.128", default-features = false }

# Unstable: only pulled in under `--cfg wasm_bindgen_unstable_tokio`, and
# requires tokio's emscripten event-loop support (tokio-rs/tokio#8484).
[target.'cfg(all(target_os = "emscripten", wasm_bindgen_unstable_tokio))'.dependencies]
tokio = { version = "1", features = ["rt", "time"], default-features = false }

[features]
default = ["std"]
futures-core-03-stream = ["js-sys/futures-core-03-stream"]
std = ["wasm-bindgen/std", "js-sys/std"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
futures-channel = "0.3"
futures-lite = { version = "2", default-features = false }
wasm-bindgen-test = { path = '../test' }

[lints]
workspace = true
